name: CLAUDE LOTMIX
on:
  push:
    paths-ignore:
      - '**'
  schedule:
    - cron: "30 14 * * *"
    - cron: "15 16 * * *"
    - cron: "40 16 * * *"
    - cron: "15 17 * * *"
    - cron: "10 20 * * *"
    - cron: "15 22 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar notificacion Telegram (FORCE_NOTIFY=1)"
        required: false
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}
      - name: Install dependencies
        run: pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Run CLAUDE LOTMIX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner.py

      - name: Run CLAUDE LOTMIX v2 (paralelo)
        env:
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner_v2.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx data/state.json data/picks_log.csv outputs/ || true
          git add data_v2/ outputs_v2/ || true
          git diff --cached --quiet || git commit -m "chore: update histories & picks [skip ci]"
          git push --force