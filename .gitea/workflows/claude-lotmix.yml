name: CLAUDE LOTMIX
on:
  schedule:
    - cron: "30 15 * * *"  # 11:30 AM RD
    - cron: "15 16 * * *"  # 12:15 PM RD
    - cron: "40 16 * * *"  # 12:40 PM RD
    - cron: "15 17 * * *"  # 1:15 PM RD
    - cron: "10 20 * * *"  # 4:10 PM RD
    - cron: "15 22 * * *"  # 6:15 PM RD
    - cron: "15 23 * * *"  # 7:15 PM RD
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar notificación Telegram (FORCE_NOTIFY=1)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run CLAUDE LOTMIX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python src/runner.py
      - name: Commit updated data
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add data/histories/*.xlsx data/state.json data/picks_log.csv outputs/ || true
          git diff --cached --quiet || git commit -m "chore: update histories & picks [skip ci]"
          git push